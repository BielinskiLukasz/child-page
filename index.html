<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f3eefb">
  <title>Spokojny Świat Artura</title>
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Świat Artura">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="menu-view" class="view">
    <h1 class="title">Spokojny Świat Artura</h1>
    <ul id="tiles" class="tiles"></ul>
    <button id="gear" class="gear" type="button" aria-label="Ustawienia dla rodzica">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zM10.5 2h3l.5 2.6 1.6.7 2.2-1.5 2.1 2.1-1.5 2.2.7 1.6L22 10.5v3l-2.6.5-.7 1.6 1.5 2.2-2.1 2.1-2.2-1.5-1.6.7-.5 2.6h-3l-.5-2.6-1.6-.7-2.2 1.5-2.1-2.1 1.5-2.2-.7-1.6L2 13.5v-3l2.6-.5.7-1.6-1.5-2.2 2.1-2.1 2.2 1.5 1.6-.7z" fill="currentColor"/></svg>
    </button>
  </main>
  <section id="activity-view" class="view" hidden>
    <button id="back" class="back" type="button" aria-label="Powrót do menu">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div id="stage" class="stage"></div>
  </section>
  <section id="parent-overlay" class="overlay" hidden>
    <div id="gate-pane" class="panel">
      <h2>Tylko dla rodzica</h2>
      <form id="gate-form">
        <p id="gate-sum" class="sum"></p>
        <label for="gate-answer">Wynik</label>
        <input id="gate-answer" type="text" inputmode="numeric" autocomplete="off" maxlength="2">
        <p id="gate-msg" class="msg" role="status"></p>
        <button type="submit">Dalej</button>
        <button id="gate-close" type="button">Zamknij</button>
      </form>
    </div>
    <div id="settings-pane" class="panel" hidden>
      <h2>Ustawienia</h2>
      <form id="settings-form">
        <label for="limit-minutes">Dzienny limit zabawy (minuty)</label>
        <input id="limit-minutes" type="text" inputmode="decimal" autocomplete="off">
        <label class="check"><input id="no-limit" type="checkbox"> Bez limitu</label>
        <button type="submit">Zapisz</button>
        <p id="used-info"></p>
        <button id="reset-timer" type="button">Zeruj czas</button>
        <p id="settings-msg" class="msg" role="status"></p>
        <button id="settings-close" type="button">Zamknij</button>
      </form>
      <section class="acts" aria-labelledby="acts-title">
        <h3 id="acts-title">Zabawy w menu</h3>
        <ul id="act-list" class="act-list"></ul>
        <p id="act-msg" class="msg" role="status"></p>
        <button id="act-reset" type="button">Przywróć domyślne</button>
        <div id="act-confirm" class="act-confirm" role="group" aria-label="Potwierdzenie" hidden>
          <p>Przywrócić wszystkie zabawy w pierwotnej kolejności?</p>
          <button id="act-confirm-yes" type="button">Tak</button>
          <button id="act-confirm-no" type="button">Nie</button>
        </div>
      </section>
    </div>
  </section>
  <script src="js/activities.js"></script>
  <script src="js/random.js"></script>
  <script src="js/animals.js"></script>
  <script src="js/menu-config.js"></script>
  <script src="js/playtime.js"></script>
  <script src="js/motyle.js"></script>
  <script src="js/malowanie.js"></script>
  <script src="js/akwarium.js"></script>
  <script src="js/ogrod.js"></script>
  <script src="js/niebo.js"></script>
  <script src="js/dzien-i-noc.js"></script>
  <script src="js/pociag.js"></script>
  <script src="js/banki.js"></script>
  <script src="js/dobranoc.js"></script>
  <script src="js/deszczyk.js"></script>
  <script src="js/ksztalty.js"></script>
  <script src="js/farma.js"></script>
  <script src="js/policz-razem.js"></script>
  <script src="js/ubierz-misia.js"></script>
  <script src="js/przeciwienstwa.js"></script>
  <script src="js/literki-data.js"></script>
  <script src="js/literki.js"></script>
  <script src="js/co-nie-pasuje.js"></script>
  <script src="js/sciezka.js"></script>
  <script src="js/wzorki.js"></script>
  <script src="js/chowany.js"></script>
  <script src="js/koraliki.js"></script>
  <script src="js/duze-i-male.js"></script>
  <script src="js/kubeczki.js"></script>
  <script src="js/puzzle-pictures.js"></script>
  <script src="js/puzzle.js"></script>
  <script src="js/wieza.js"></script>
  <script src="js/myjnia.js"></script>
  <script src="js/cienie.js"></script>
  <script src="js/buzki.js"></script>
  <script src="js/pamiec.js"></script>
  <script src="js/pilka.js"></script>
  <script src="js/rysuj-ksztalty.js"></script>
  <script src="js/samolot.js"></script>
  <script src="js/traktor.js"></script>
  <script src="js/autobusik.js"></script>
  <script src="js/rakieta.js"></script>
  <script src="js/lodka.js"></script>
  <script src="js/podwodna.js"></script>
  <script src="js/kolejka.js"></script>
  <script src="js/balon.js"></script>
  <script src="js/karuzela.js"></script>
  <script src="js/zjezdzalnia.js"></script>
  <script src="js/hustawka.js"></script>
  <script src="js/latawiec.js"></script>
  <script src="js/wiatraczki.js"></script>
  <script src="js/kukulka.js"></script>
  <script src="js/kapiel.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
